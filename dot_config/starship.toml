"$schema" = "https://starship.rs/config-schema.json"
# Shared prompt for pwsh (Windows) and zsh (WSL). https://starship.rs/config/
# Two-line minimal layout with Catppuccin Mocha colors:
#   ~/src/project main* ⇡                        .NET 10 · 7s
#   ❯
add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"

format = """
$directory$git_branch$git_status$fill$dotnet$nodejs$cmd_duration
$character"""

[directory]
style = "blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 8
truncate_to_repo = false

[git_branch]
style = "overlay1"
symbol = " "  # Nerd Font branch glyph
format = "[$symbol$branch]($style) "

# One "*" for any change (zero-width spaces), arrows for ahead/behind
[git_status]
style = "teal"
format = "([*$conflicted$untracked$modified$staged$renamed$deleted](overlay1))([ $ahead_behind$stashed]($style)) "
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇣⇡"

[fill]
symbol = " "

[dotnet]
style = "lavender"
format = "[$symbol($version )]($style)"
detect_files = ["global.json", "Directory.Build.props", "*.sln", "*.slnx"]

[nodejs]
style = "green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc"]

[cmd_duration]
min_time = 5000
style = "yellow"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
